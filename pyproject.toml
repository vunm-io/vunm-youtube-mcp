[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vunm-youtube-mcp"
version = "0.1.0"
description = "Custom Model Context Protocol (MCP) server for YouTube Studio analytics, video metadata management, and transcript extraction."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vu Nguyen", email = "vunm.dev@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "youtube-transcript-api>=0.6.2",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "youtube",
    "youtube-api",
    "fastmcp",
    "youtube-studio",
    "analytics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/vunm-io/vunm-youtube-mcp"
Repository = "https://github.com/vunm-io/vunm-youtube-mcp"
Issues = "https://github.com/vunm-io/vunm-youtube-mcp/issues"

[project.scripts]
vunm-youtube-mcp = "src.server:mcp.run"
